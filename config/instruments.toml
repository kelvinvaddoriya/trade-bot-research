# Whitelisted instruments (docs/03 §3). ISINs to be confirmed against Trading 212 metadata in P1.
# yahoo  = research history source (docs/10, step 4)
# alpaca = official US data, used to cross-check Yahoo and (from P1) as the US runtime source
# proxy  = US-listed twin whose EUR-converted history stands in before the UCITS ETF existed
# native_from = first date the instrument's own Yahoo history is trusted (earlier Xetra ETF data is
#               stale or wrong; see docs/10 step 4). Proxy history, if any, is used before it.

