# Behaviour settings (docs/04 §8).
mode = "demo"                  # backtest | shadow | demo | live. The live engine (`run`) accepts only "demo" until P3.

[live]                         # the P1 demo engine (docs/10, P1)
start = "2026-09-28"           # first session of the demo run; the daily forward check backtests from here
# All four trade demo money (owner, 2026-09-30: "take multiple trades, fail-pass and learn"). S1 passed its gate;
# S2 failed it, S3 and S4 were never gated: they are experiments, and none of them can go live without the gates.
strategies = ["s1_trend", "s2_pullback", "s3_breakout", "s4_monkey"]
shadow = []

[budgets_eur]                  # per-strategy share of the €1,000 cap (docs/03 §4)
s1_trend = 600                 # unchanged: S1 runs as backtested
s2_pullback = 140              # 2026-09-30: S2's former €400 is split across the three experiments
s3_breakout = 130
s4_monkey = 130

[costs]                        # per side, fraction of notional (docs/06 §2.3)
eu_slippage = 0.0010           # EU stocks & UCITS ETFs: half-spread + slippage
us_slippage = 0.0005           # US stocks
us_fx_fee = 0.0015             # Trading 212 FX fee on USD instruments

[periods]                      # docs/06 §2.4
data_start = "2006-01-01"      # warm-up for 200-day averages before the first test year
in_sample_start = "2007-01-01"
in_sample_end = "2019-12-31"
holdout_start = "2020-01-01"
holdout_end = "2024-12-31"
recent_start = "2025-01-01"
